---
# Grafana Alloy Package Installation Tasks
# Install Grafana Alloy package and repository setup using arillso.system.packages

# Debian/Ubuntu installation with repository setup
- name: Install package dependencies (Debian/Ubuntu)
  # gnupg (for the GPG key dearmor below) and apt-transport-https are
  # not guaranteed on minimal images; install them before the key setup.
  ansible.builtin.apt:
      name: "{{ alloy_package_dependencies }}"
      state: present
      update_cache: true
  become: true
  when:
      - ansible_facts['os_family'] == "Debian"
      - not alloy_package_only
  tags: [alloy, install, dependencies]

- name: Setup Grafana GPG key
  ansible.builtin.include_role:
      name: arillso.system.packages
      tasks_from: keys
  vars:
      packages_keys:
          - url: "{{ alloy_grafana_gpg_key_url }}"
            state: present
            keyring: "{{ alloy_grafana_keyring_path }}"
            name: grafana
            dearmor: true
  when:
      - ansible_facts['os_family'] == "Debian"
      - not alloy_package_only
  tags: [alloy, install, keys]

- name: Setup Grafana repository
  ansible.builtin.include_role:
      name: arillso.system.packages
      tasks_from: repositories
  vars:
      packages_repositories:
          - repo: "deb [signed-by={{ alloy_grafana_keyring_path }}] https://apt.grafana.com stable main"
            state: present
            filename: grafana
            update_cache: false # We'll update cache separately
  when:
      - ansible_facts['os_family'] == "Debian"
      - not alloy_package_only
  tags: [alloy, install, repository]

- name: Update package cache
  ansible.builtin.include_role:
      name: arillso.system.packages
      tasks_from: cache
  when:
      - ansible_facts['os_family'] == "Debian"
      - not alloy_package_only
  tags: [alloy, install, cache]

- name: Resolve the pinned alloy version (Debian/Ubuntu)
  ansible.builtin.include_tasks: resolve_version.yml
  when:
      - ansible_facts['os_family'] == "Debian"
      - not alloy_package_only
      - alloy_version | length > 0
      - alloy_package_state != 'absent'
  tags: [alloy, install, package]

# ansible.builtin.apt directly rather than arillso.system.packages: a pin has
# to move hosts in both directions, and only the apt module exposes
# allow_downgrade. apt rejects a version together with state=latest, so a pin
# turns latest into present.
- name: Install Grafana Alloy package (Debian/Ubuntu)
  ansible.builtin.apt:
      name: >-
          {{ alloy_package_name ~ ('=' ~ _alloy_apt_version
             if _alloy_apt_version | default('') | length > 0 and alloy_package_state != 'absent' else '') }}
      state: >-
          {{ 'present' if _alloy_apt_version | default('') | length > 0 and alloy_package_state != 'absent' and alloy_package_state == 'latest'
             else alloy_package_state }}
      allow_downgrade: "{{ _alloy_apt_version | default('') | length > 0 and alloy_package_state != 'absent' }}"
  become: true
  register: _alloy_package_installed_debian
  retries: 3
  delay: 10
  until: _alloy_package_installed_debian is succeeded
  when:
      - ansible_facts['os_family'] == "Debian"
      - not alloy_package_only
  # The handler runs after configure.yml has written config.alloy, so an
  # upgrade restarts alloy on the real config, not the package default.
  notify: "alloy: restart alloy"
  tags: [alloy, install, package]

# Red Hat family installation tasks
- name: Add Grafana repository (Red Hat family)
  ansible.builtin.yum_repository:
      name: grafana
      description: Grafana Repository
      baseurl: "{{ alloy_grafana_repository }}"
      gpgkey: "{{ alloy_grafana_gpg_key_url }}"
      gpgcheck: true
      enabled: true
      state: present
  when:
      - ansible_facts['os_family'] == "RedHat"
      - not alloy_package_only
  tags: [alloy, install, repository]

# dnf takes "<name>-<version>-*" and expands the glob over the RPM release
# part; the hyphen keeps 1.21.3 from matching 1.21.30.
- name: Install Grafana Alloy package (Red Hat family)
  ansible.builtin.package:
      name: >-
          {{ alloy_package_name ~ ('-' ~ alloy_version ~ '-*'
             if alloy_version | length > 0 and alloy_package_state != 'absent' else '') }}
      state: >-
          {{ 'present' if alloy_version | length > 0 and alloy_package_state != 'absent' and alloy_package_state == 'latest'
             else alloy_package_state }}
      allow_downgrade: "{{ true if alloy_version | length > 0 and alloy_package_state != 'absent' else omit }}"
  become: true
  register: _alloy_package_installed
  retries: 3
  delay: 10
  until: _alloy_package_installed is succeeded
  when:
      - ansible_facts['os_family'] == "RedHat"
      - not alloy_package_only
  notify: "alloy: restart alloy"
  tags: [alloy, install, package]

# Package-only installation (Alpine, Arch, etc.)
- name: Install Grafana Alloy package (Package Only Mode)
  ansible.builtin.package:
      name: "{{ alloy_package_name }}"
      state: "{{ alloy_package_state }}"
  register: _alloy_package_installed_simple
  retries: 3
  delay: 10
  until: _alloy_package_installed_simple is succeeded
  when: alloy_package_only
  notify: "alloy: restart alloy"
  tags: [alloy, install, package]

# Generic installation for other OS families (fallback)
- name: Install Grafana Alloy package (Generic)
  ansible.builtin.package:
      name: "{{ alloy_package_name }}"
      state: "{{ alloy_package_state }}"
  register: _alloy_package_installed_generic
  retries: 3
  delay: 10
  until: _alloy_package_installed_generic is succeeded
  when:
      - ansible_facts['os_family'] not in ["Debian", "RedHat"]
      - not alloy_package_only
  notify: "alloy: restart alloy"
  tags: [alloy, install, package]

- name: Create required directories
  ansible.builtin.file:
      path: "{{ item }}"
      state: directory
      owner: "{{ alloy_user }}"
      group: "{{ alloy_group }}"
      mode: "0755"
  become: true
  loop:
      - "{{ alloy_config_file | dirname }}"
      - "{{ alloy_storage_path }}"
      - "{{ alloy_log_file | dirname if alloy_log_file else '/var/log/alloy' }}"
  tags: [alloy, install, config]
