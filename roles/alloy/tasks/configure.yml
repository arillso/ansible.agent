---
# Configuration tasks for Grafana Alloy

- name: Generate Grafana Alloy configuration
  ansible.builtin.template:
      src: "{{ alloy_config_template }}"
      dest: "{{ alloy_config_file }}"
      owner: root
      group: "{{ alloy_group }}"
      mode: "0640"
  become: true
  notify: "alloy: restart alloy"
  no_log: "{{ alloy_no_log_config | default(true) }}"

- name: Find leftover Grafana Alloy configuration backups
  ansible.builtin.find:
      paths: "{{ alloy_config_file | dirname }}"
      patterns: "{{ alloy_config_file | basename }}.*~"
      file_type: file
  register: alloy_config_backups
  become: true

- name: Remove leftover Grafana Alloy configuration backups
  ansible.builtin.file:
      path: "{{ item.path }}"
      state: absent
  loop: "{{ alloy_config_backups.files }}"
  loop_control:
      label: "{{ item.path }}"
  become: true

- name: Create systemd service override directory
  ansible.builtin.file:
      path: "{{ alloy_service_override_dir }}"
      state: directory
      owner: root
      group: root
      mode: "0755"
  become: true

- name: Create systemd service override file
  ansible.builtin.template:
      src: "{{ alloy_service_override_template }}"
      dest: "{{ alloy_service_override_file }}"
      owner: root
      group: root
      mode: "0644"
  become: true
  notify:
      - "alloy: reload systemd"
      - "alloy: restart alloy"

- name: Create environment file
  ansible.builtin.template:
      src: "{{ alloy_env_template }}"
      dest: "{{ alloy_env_file }}"
      owner: root
      group: root
      mode: "0600"
  become: true
  notify: "alloy: restart alloy"
  no_log: "{{ alloy_no_log_env_file | default(true) }}"

- name: Ensure log directory exists with proper permissions
  ansible.builtin.file:
      path: "/var/log/alloy"
      state: directory
      owner: "{{ alloy_user }}"
      group: "{{ alloy_group }}"
      mode: "0755"
  become: true
