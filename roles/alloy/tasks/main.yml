---
# Main tasks for Alloy role
# This file orchestrates the installation and configuration of Grafana Alloy

- name: Run Alloy role tasks
  when: alloy_enabled | bool
  block:
      - name: Include installation tasks
        ansible.builtin.include_tasks: install.yml
        tags:
            - alloy
            - install

      - name: Remove Grafana Alloy configuration after package removal
        ansible.builtin.file:
            path: "{{ item }}"
            state: absent
        loop:
            - "{{ alloy_config_file }}"
            - "{{ alloy_env_file }}"
            - "{{ alloy_service_override_dir }}"
        become: true
        when: alloy_package_state == 'absent'
        notify: "alloy: reload systemd"
        tags:
            - alloy
            - configure

      # After a removal there is no alloy user or unit left to configure.
      - name: Include configuration tasks
        ansible.builtin.include_tasks: configure.yml
        when: alloy_package_state != 'absent'
        tags:
            - alloy
            - configure

      - name: Include service management tasks
        ansible.builtin.include_tasks: service.yml
        when: alloy_package_state != 'absent'
        tags:
            - alloy
            - service

      - name: Include textfile collector script deployment
        ansible.builtin.include_tasks: textfile.yml
        when: alloy_package_state != 'absent'
        tags:
            - alloy
            - textfile
