---
# Molecule verify playbook for Grafana Alloy role
- name: Verify
  hosts: all
  become: true
  gather_facts: true

  tasks:
      - name: Check if Alloy package is installed
        ansible.builtin.package_facts:
            manager: auto

      - name: Assert Alloy package is installed
        ansible.builtin.assert:
            that:
                - "'alloy' in ansible_facts.packages"
            fail_msg: "Alloy package is not installed"
            success_msg: "Alloy package is installed"

      - name: Read the pinned alloy_version from the role defaults
        ansible.builtin.set_fact:
            alloy_expected_version: "{{ (lookup('ansible.builtin.file', playbook_dir ~ '/../../defaults/main.yml') | from_yaml).alloy_version }}"

      - name: Assert the installed alloy matches alloy_version
        ansible.builtin.assert:
            that:
                - ansible_facts.packages['alloy'][0].version is match('(.*:)?' ~ (alloy_expected_version | regex_escape) ~ '([-+]|$)')
            fail_msg: "alloy is {{ ansible_facts.packages['alloy'][0].version }}, expected {{ alloy_expected_version }}"
            success_msg: "alloy is pinned to {{ alloy_expected_version }}"

      - name: Check Alloy service status
        ansible.builtin.systemd_service:
            name: alloy
        register: alloy_service

      - name: Assert Alloy service is running
        ansible.builtin.assert:
            that:
                - alloy_service.status.ActiveState == "active"
                - alloy_service.status.LoadState == "loaded"
            fail_msg: "Alloy service is not running properly"
            success_msg: "Alloy service is running"

      - name: Check if Alloy config file exists
        ansible.builtin.stat:
            path: /etc/alloy/config.alloy
        register: alloy_config

      - name: Assert Alloy config exists
        ansible.builtin.assert:
            that:
                - alloy_config.stat.exists
                - alloy_config.stat.isreg
            fail_msg: "Alloy config file does not exist"
            success_msg: "Alloy config file exists"

      # config.alloy can carry credentials: alloy reads it through the group,
      # cannot write it, and other users cannot read it.
      - name: Assert Alloy config is root:alloy 0640
        ansible.builtin.assert:
            that:
                - alloy_config.stat.pw_name == 'root'
                - alloy_config.stat.gr_name == 'alloy'
                - alloy_config.stat.mode == '0640'
            fail_msg: >-
                config.alloy is {{ alloy_config.stat.pw_name }}:{{ alloy_config.stat.gr_name }}
                {{ alloy_config.stat.mode }}, expected root:alloy 0640
            success_msg: "config.alloy is root:alloy 0640"

      - name: Check Alloy config directory
        ansible.builtin.stat:
            path: /etc/alloy
        register: alloy_config_dir

      - name: Assert Alloy config directory is root:alloy 0750
        ansible.builtin.assert:
            that:
                - alloy_config_dir.stat.isdir
                - alloy_config_dir.stat.pw_name == 'root'
                - alloy_config_dir.stat.gr_name == 'alloy'
                - alloy_config_dir.stat.mode == '0750'
            fail_msg: >-
                /etc/alloy is {{ alloy_config_dir.stat.pw_name }}:{{ alloy_config_dir.stat.gr_name }}
                {{ alloy_config_dir.stat.mode }}, expected root:alloy 0750
            success_msg: "/etc/alloy is root:alloy 0750"

      - name: Find Alloy configuration backup leftovers
        ansible.builtin.find:
            paths: /etc/alloy
            patterns: "config.alloy.*~"
            file_type: file
        register: alloy_config_backup_leftovers

      - name: Assert no Alloy configuration backups remain
        ansible.builtin.assert:
            that:
                - alloy_config_backup_leftovers.files | length == 0
            fail_msg: >-
                Leftover Alloy config backups found:
                {{ alloy_config_backup_leftovers.files | map(attribute='path') | list }}
            success_msg: "No Alloy config backups remain in /etc/alloy"

      - name: Check the package-manager artifact planted by side_effect
        ansible.builtin.stat:
            path: /etc/alloy/config.alloy.dpkg-dist
        register: alloy_config_dpkg_dist

      - name: Assert the package-manager artifact survived the cleanup
        ansible.builtin.assert:
            that:
                - alloy_config_dpkg_dist.stat.exists
            fail_msg: "Cleanup removed config.alloy.dpkg-dist, which is not an Ansible backup"
            success_msg: "config.alloy.dpkg-dist left untouched"

      - name: Check if Alloy is listening on port
        ansible.builtin.wait_for:
            port: 12345
            timeout: 10
            state: started
        register: alloy_port_check
        ignore_errors: true

      # The role renders a single config.alloy with the per-feature
      # modules included inline (config.alloy.j2 uses {% include %}),
      # not separate files under /etc/alloy/modules/. Verify the enabled
      # features by their components in config.alloy.
      - name: Read generated Alloy config
        ansible.builtin.slurp:
            src: /etc/alloy/config.alloy
        register: alloy_config_content

      - name: Assert enabled feature components are present in config
        ansible.builtin.assert:
            that:
                - "'prometheus.scrape' in _alloy_config"
                - "'prometheus.exporter.unix' in _alloy_config"
                - "'loki.source' in _alloy_config"
            fail_msg: "Expected feature components missing from config.alloy"
            success_msg: "Prometheus, node exporter and Loki components are configured"
        vars:
            _alloy_config: "{{ alloy_config_content.content | b64decode }}"
