---
# Internal OS-specific variables for Grafana Alloy installation and configuration
# All variables are prefixed with _alloy_ to ensure proper namespacing

# OS-specific configuration
_alloy_os:
    Debian:
        package_dependencies:
            - curl
            - gnupg
            - apt-transport-https
        grafana:
            gpg_key_url: "https://apt.grafana.com/gpg.key"
            keyring_path: "/usr/share/keyrings/grafana-archive-keyring.gpg"
            repository: "deb [signed-by={{ alloy_grafana_keyring_path }}] https://apt.grafana.com stable main"

    RedHat:
        grafana:
            gpg_key_url: "https://rpm.grafana.com/gpg.key"
            repository: "https://rpm.grafana.com"

# host part of host:port for --server.*.listen-addr and the readiness check;
# IPv6 needs brackets, already bracketed values are kept
_alloy_http_listen_host: >-
    {{ ('[' ~ alloy_server_http_listen_address ~ ']')
       if ':' in alloy_server_http_listen_address and not alloy_server_http_listen_address.startswith('[')
       else alloy_server_http_listen_address }}
_alloy_grpc_listen_host: >-
    {{ ('[' ~ alloy_server_grpc_listen_address ~ ']')
       if ':' in alloy_server_grpc_listen_address and not alloy_server_grpc_listen_address.startswith('[')
       else alloy_server_grpc_listen_address }}
