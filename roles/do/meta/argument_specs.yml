---
# Argument specifications for DigitalOcean Agent role
# This file defines and validates all input parameters for the role

argument_specs:
    main:
        short_description: "Install and configure DigitalOcean Agent for monitoring and observability"
        description: |
            This role installs and configures the DigitalOcean Agent via official package sources
            for monitoring and observability of DigitalOcean Droplets.
        author: "Simon Bärlocher"
        examples: |
            - name: Install the DigitalOcean Agent
              hosts: digitalocean_droplets
              roles:
                - role: arillso.agent.do

            - name: Expose do-agent metrics on a local Prometheus endpoint
              hosts: digitalocean_droplets
              roles:
                - role: arillso.agent.do
                  vars:
                    do_prometheus_enabled: true
                    do_prometheus_port: 9091
                    do_labels:
                      environment: "production"
        options:
            do_enabled:
                type: "bool"
                required: false
                default: true
                description: "Master switch: set to false to skip the role entirely"

            do_package_name:
                type: "str"
                required: false
                default: "do-agent"
                description: "Name of the DigitalOcean Agent package"

            do_version:
                type: "str"
                required: false
                # renovate: datasource=github-releases depName=digitalocean/do-agent
                default: "3.18.17"
                description: "Version of the DigitalOcean Agent package to pin on apt and dnf hosts. Every run moves the host to exactly this version, downgrades included. An empty string installs whatever the repository offers and leaves later upgrades to the host."

            do_port:
                type: "int"
                required: false
                default: 9090
                description: "Kept for compatibility. do-agent has no flag for this; the role warns when it is set and it has no effect. The metrics endpoint port is do_prometheus_port."

            do_health_check_enabled:
                type: "bool"
                required: false
                default: true
                description: "Enables health check after installation"

            do_log_level:
                type: "str"
                required: false
                default: "info"
                choices:
                    - "debug"
                    - "info"
                    - "warn"
                    - "error"
                description: 'Log level. "debug" passes --debug to do-agent; the agent has no flag for the other levels.'

            do_log_format:
                type: "str"
                required: false
                default: "json"
                choices:
                    - "json"
                    - "text"
                description: "Kept for compatibility. do-agent has no flag for this; the role warns when it is set and it has no effect."

            do_storage_path:
                type: "str"
                required: false
                default: "/var/lib/do-agent"
                description: "Kept for compatibility. do-agent has no flag for this; the role warns when it is set and it has no effect."

            do_listen_address:
                type: "str"
                required: false
                default: "0.0.0.0"
                description: "Listen address of the Prometheus metrics endpoint, passed as --web.listen-address=<address>:<do_prometheus_port> when do_prometheus_enabled is true."

            do_api_token:
                type: "str"
                required: false
                default: ""
                no_log: true
                description: "Kept for compatibility. do-agent has no flag for this; the role warns when it is set and it has no effect. Earlier versions wrote it to files the agent never read; the role now deletes those files."

            do_droplet_id:
                type: "str"
                required: false
                default: ""
                description: "Kept for compatibility. do-agent has no flag for this; the role warns when it is set and it has no effect. The agent reads the Droplet ID from the metadata service."

            do_no_log_api_token:
                type: "bool"
                required: false
                default: true
                description: "Kept for compatibility. No task renders the token any more, so it has no effect."

            do_prometheus_enabled:
                type: "bool"
                required: false
                default: false
                description: "Passes --web.listen to do-agent, which serves its metrics on a local Prometheus endpoint."

            do_prometheus_port:
                type: "int"
                required: false
                default: 9091
                description: "Port of the Prometheus metrics endpoint (see do_listen_address)."

            do_custom_config_enabled:
                type: "bool"
                required: false
                default: false
                description: "Kept for compatibility. do-agent reads no config file; the role warns when it is set and it has no effect."

            do_tags:
                type: "list"
                required: false
                default: []
                description: "Kept for compatibility. do-agent has no flag for this; the role warns when it is set and it has no effect. Use do_labels for key:value labels."

                elements: "str"

            do_labels:
                type: "dict"
                required: false
                default: {}
                description: "Labels added to all metrics, each passed as --additional-label=<key>:<value>."

            do_extra_flags:
                type: "list"
                elements: "str"
                required: false
                default: []
                description: "Raw do-agent flags appended to ExecStart, for flags the role has no variable for (e.g. --process-topk=50, --metrics-path=...)."
