---
# Installation tasks for DigitalOcean Agent

- name: Install package dependencies (Debian/Ubuntu)
  # Minimal images ship without package lists, so the cache has to be
  # refreshed here rather than relying on the caller to have done it.
  ansible.builtin.apt:
      name: "{{ do_package_dependencies }}"
      state: present
      update_cache: true
  become: true
  when: ansible_facts['os_family'] == "Debian"

- name: Install package dependencies (RedHat/CentOS)
  ansible.builtin.package:
      name: "{{ do_package_dependencies }}"
      state: present
  become: true
  when: ansible_facts['os_family'] == "RedHat"

- name: Download DigitalOcean GPG key (Debian/Ubuntu)
  ansible.builtin.get_url:
      url: "{{ do_gpg_key_url }}"
      dest: /usr/share/keyrings/digitalocean-agent.asc
      mode: "0644"
  become: true
  when: ansible_facts['os_family'] == "Debian"

- name: Add DigitalOcean repository (Debian/Ubuntu)
  ansible.builtin.apt_repository:
      repo: "deb [signed-by=/usr/share/keyrings/digitalocean-agent.asc] https://repos.insights.digitalocean.com/apt/do-agent/ main main"
      state: present
      update_cache: true
      filename: digitalocean-agent
  become: true
  when: ansible_facts['os_family'] == "Debian"

- name: Add DigitalOcean repository (RedHat/CentOS)
  ansible.builtin.yum_repository:
      name: digitalocean
      description: DigitalOcean Repository
      baseurl: "{{ do_repository_rpm }}"
      gpgcheck: true
      gpgkey: "{{ do_gpg_key_url }}"
      enabled: true
  become: true
  when: ansible_facts['os_family'] == "RedHat"

- name: Resolve the pinned do-agent version (Debian/Ubuntu)
  ansible.builtin.include_tasks: resolve_version.yml
  when:
      - ansible_facts['os_family'] == "Debian"
      - do_version | length > 0

# apt pins with "=<full string>", dnf with "-<version>*"; other families have
# no repository here and install unpinned. allow_downgrade lets a pin move a
# host back as well as forward.
- name: Install DigitalOcean Agent package
  ansible.builtin.package:
      name: >-
          {{ do_package_name ~ ('=' ~ _do_apt_version if (_do_pinned | bool) and ansible_facts['os_family'] == 'Debian'
             else '-' ~ do_version ~ '*' if (_do_pinned | bool)
             else '') }}
      state: present
      allow_downgrade: "{{ true if (_do_pinned | bool) else omit }}"
  vars:
      _do_pinned: "{{ do_version | length > 0 and ansible_facts['os_family'] in ['Debian', 'RedHat'] }}"
  become: true
  notify: "do: restart do agent"

- name: Create required directories
  ansible.builtin.file:
      path: "{{ item }}"
      state: directory
      owner: root
      group: root
      mode: "0755"
  become: true
  loop:
      - /etc/do-agent
      - /var/lib/do-agent
      - /var/log/do-agent
