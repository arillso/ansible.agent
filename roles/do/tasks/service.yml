---
# Service management tasks for DigitalOcean Agent

- name: Enable and start DigitalOcean Agent service
  ansible.builtin.systemd_service:
      name: do-agent
      enabled: true
      state: started
      daemon_reload: true
  become: true

# Run a pending restart now so the health check sees the process it leaves.
# meta tasks ignore `when`, so this stays outside the health-check condition.
- name: Apply pending DigitalOcean Agent restarts
  ansible.builtin.meta: flush_handlers

- name: Wait for DigitalOcean Agent to report active
  ansible.builtin.command: systemctl is-active do-agent
  register: do_agent_active
  until: do_agent_active.stdout == "active"
  retries: 10
  delay: 3
  changed_when: false
  failed_when: do_agent_active.stdout != "active"
  when: do_health_check_enabled | bool
