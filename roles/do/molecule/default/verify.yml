---
# Molecule verify playbook for DigitalOcean Agent role
- name: Verify
  hosts: all
  become: true
  gather_facts: true

  tasks:
      - name: Check if DO Agent package is installed
        ansible.builtin.package_facts:
            manager: auto

      - name: Assert DO Agent package is installed
        ansible.builtin.assert:
            that:
                - "'do-agent' in ansible_facts.packages"
            fail_msg: "DO Agent package is not installed"
            success_msg: "DO Agent package is installed"

      - name: Read the pinned do_version from the role defaults
        ansible.builtin.set_fact:
            do_expected_version: "{{ (lookup('ansible.builtin.file', playbook_dir ~ '/../../defaults/main.yml') | from_yaml).do_version }}"

      - name: Assert the installed do-agent matches do_version
        ansible.builtin.assert:
            that:
                - ansible_facts.packages['do-agent'][0].version is match('(.*:)?' ~ (do_expected_version | regex_escape) ~ '([-+]|$)')
            fail_msg: "do-agent is {{ ansible_facts.packages['do-agent'][0].version }}, expected {{ do_expected_version }}"
            success_msg: "do-agent is pinned to {{ do_expected_version }}"

      - name: Check DO Agent service status
        ansible.builtin.systemd_service:
            name: do-agent
        register: do_service

      - name: Assert DO Agent service is enabled
        ansible.builtin.assert:
            that:
                - do_service.status.LoadState == "loaded"
                - do_service.status.UnitFileState == "enabled"
            fail_msg: "DO Agent service is not properly configured"
            success_msg: "DO Agent service is properly configured"

      - name: Read the effective DO Agent ExecStart
        ansible.builtin.command: systemctl show do-agent --property=ExecStart --value
        register: do_exec_start
        changed_when: false

      - name: Assert converge settings reach do-agent as flags
        ansible.builtin.assert:
            that:
                - "'--web.listen ' in do_exec_start.stdout"
                - "'--web.listen-address=0.0.0.0:9091' in do_exec_start.stdout"
                - "'--additional-label=molecule:true' in do_exec_start.stdout"
            fail_msg: "do-agent ExecStart lacks the converge flags: {{ do_exec_start.stdout }}"
            success_msg: "do-agent runs with the converge flags"

      - name: Check legacy DO Agent configuration paths
        ansible.builtin.stat:
            path: "{{ item }}"
        register: do_legacy_paths
        loop:
            - /etc/do-agent
            - /etc/default/do-agent

      - name: Assert no legacy DO Agent configuration remains
        ansible.builtin.assert:
            that:
                - not item.stat.exists
            fail_msg: "Legacy DO Agent path {{ item.item }} is still on the host"
            success_msg: "Legacy DO Agent path {{ item.item }} is gone"
        loop: "{{ do_legacy_paths.results }}"
        loop_control:
            label: "{{ item.item }}"

      - name: Verify required directories exist
        ansible.builtin.stat:
            path: "{{ item }}"
        register: do_directories
        loop:
            - /var/lib/do-agent
            - /var/log/do-agent

      - name: Assert all required directories exist
        ansible.builtin.assert:
            that:
                - item.stat.exists
                - item.stat.isdir
            fail_msg: "Directory {{ item.item }} does not exist"
            success_msg: "Directory {{ item.item }} exists"
        loop: "{{ do_directories.results }}"
