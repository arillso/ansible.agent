---
tailscale_package_name: tailscale
tailscale_package_state: present
# Pinned on apt and dnf hosts, downgrades included; "" installs unpinned
# renovate: datasource=github-releases depName=tailscale/tailscale extractVersion=^v(?<version>.*)$
tailscale_version: "1.104.7"

# Master switch: set to false to skip the role entirely
tailscale_enabled: true

# Derived per distribution from tailscale_distro_config (vars/main.yml);
# override for a mirror or an unlisted release
tailscale_gpg_key_url: "{{ tailscale_distro_config.gpg_key_url | default('') }}"
tailscale_gpg_key_path: /usr/share/keyrings/tailscale-archive-keyring.gpg
tailscale_repo_url: "{{ tailscale_distro_config.repo_url | default('') }}"
tailscale_repo_codename: "{{ tailscale_distro_config.codename | default(ansible_facts['distribution_release']) }}"
tailscale_package_only: "{{ tailscale_distro_config.package_only | default(false) }}"

tailscale_service_state: started
tailscale_service_enabled: true

tailscale_config_dir: /etc/tailscale
tailscale_config_enabled: true
tailscale_config_file: /etc/tailscale/config.json

tailscale_auth_key: ""
# Config-file mode only: the key is written here and referenced as authKey.
tailscale_auth_key_file: /etc/tailscale/authkey
tailscale_tags: []
tailscale_reset_authentication: false

# Censor the auth-key `tailscale up` command output. Keep true unless
# debugging a join failure (set false for one run to surface the real
# error, which no_log otherwise hides as "non-zero return code").
tailscale_no_log_auth_key: true

# Run the connectivity verification phase (verify.yml). Requires a
# running, authenticated tailscaled; disable for install-only runs.
tailscale_verify_connectivity: true

tailscale_preferences: {}
tailscale_service_override:
    ExecStart:
        - ""
        - >-
            /usr/sbin/tailscaled
            --state=/var/lib/tailscale/tailscaled.state
            --socket=/run/tailscale/tailscaled.sock
            --port=${PORT}
            $FLAGS{{ (' --config=' ~ tailscale_config_file) if _tailscale_write_config | default(false) | bool else '' }}

tailscale_server_url: ""
tailscale_locked: ""
tailscale_daemon_enabled: ""
tailscale_hostname: ""
tailscale_operator_user: ""

tailscale_accept_dns: ""
tailscale_accept_routes: ""
tailscale_advertise_routes: []
tailscale_snat_subnet_routes: ""

tailscale_exit_node: ""
tailscale_exit_node_allow_lan_access: ""

tailscale_ssh_enabled: ""
tailscale_webclient_enabled: ""
tailscale_shields_up: ""
tailscale_posture_checking: ""
tailscale_advertise_services: []

tailscale_advertise_exit_node: ""
tailscale_advertise_connector: ""

tailscale_auto_update_check: ""
tailscale_auto_update_apply: ""

tailscale_netfilter_mode: ""
tailscale_stateful_filtering: ""

tailscale_static_endpoints: []
