---
# Tailscale configuration for all supported distributions
# Clean YAML structure without complex Jinja2 templates

# Distribution-specific configurations
tailscale_distributions:
    Ubuntu:
        "24.04":
            codename: noble
            gpg_key_url: https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg
            repo_url: https://pkgs.tailscale.com/stable/ubuntu
        "22.04":
            codename: jammy
            gpg_key_url: https://pkgs.tailscale.com/stable/ubuntu/jammy.noarmor.gpg
            repo_url: https://pkgs.tailscale.com/stable/ubuntu
        "20.04":
            codename: focal
            gpg_key_url: https://pkgs.tailscale.com/stable/ubuntu/focal.noarmor.gpg
            repo_url: https://pkgs.tailscale.com/stable/ubuntu
        "18.04":
            codename: bionic
            gpg_key_url: https://pkgs.tailscale.com/stable/ubuntu/bionic.noarmor.gpg
            repo_url: https://pkgs.tailscale.com/stable/ubuntu
        default:
            codename: jammy
            gpg_key_url: https://pkgs.tailscale.com/stable/ubuntu/jammy.noarmor.gpg
            repo_url: https://pkgs.tailscale.com/stable/ubuntu

    Debian:
        "12":
            codename: bookworm
            gpg_key_url: https://pkgs.tailscale.com/stable/debian/bookworm.noarmor.gpg
            repo_url: https://pkgs.tailscale.com/stable/debian
        "11":
            codename: bullseye
            gpg_key_url: https://pkgs.tailscale.com/stable/debian/bullseye.noarmor.gpg
            repo_url: https://pkgs.tailscale.com/stable/debian
        "10":
            codename: buster
            gpg_key_url: https://pkgs.tailscale.com/stable/debian/buster.noarmor.gpg
            repo_url: https://pkgs.tailscale.com/stable/debian
        default:
            codename: bookworm
            gpg_key_url: https://pkgs.tailscale.com/stable/debian/bookworm.noarmor.gpg
            repo_url: https://pkgs.tailscale.com/stable/debian

    RedHat:
        default:
            repo_url: https://pkgs.tailscale.com/stable/rhel/{{ ansible_facts['distribution_major_version'] }}/$basearch
            gpg_key_url: https://pkgs.tailscale.com/stable/rhel/{{ ansible_facts['distribution_major_version'] }}/repo.gpg

    CentOS:
        default:
            repo_url: https://pkgs.tailscale.com/stable/centos/{{ ansible_facts['distribution_major_version'] }}/$basearch
            gpg_key_url: https://pkgs.tailscale.com/stable/centos/{{ ansible_facts['distribution_major_version'] }}/repo.gpg

    Rocky:
        default:
            repo_url: https://pkgs.tailscale.com/stable/rhel/{{ ansible_facts['distribution_major_version'] }}/$basearch
            gpg_key_url: https://pkgs.tailscale.com/stable/rhel/{{ ansible_facts['distribution_major_version'] }}/repo.gpg

    AlmaLinux:
        default:
            repo_url: https://pkgs.tailscale.com/stable/rhel/{{ ansible_facts['distribution_major_version'] }}/$basearch
            gpg_key_url: https://pkgs.tailscale.com/stable/rhel/{{ ansible_facts['distribution_major_version'] }}/repo.gpg

    Fedora:
        default:
            repo_url: https://pkgs.tailscale.com/stable/fedora/$basearch
            gpg_key_url: https://pkgs.tailscale.com/stable/fedora/repo.gpg

    Alpine:
        default:
            package_only: true

    Archlinux:
        default:
            package_only: true

# Fallback configuration
tailscale_fallback:
    codename: jammy
    gpg_key_url: https://pkgs.tailscale.com/stable/ubuntu/jammy.noarmor.gpg
    repo_url: https://pkgs.tailscale.com/stable/ubuntu

# Determine version key for lookup
tailscale_version_key: >-
    {{- ansible_facts['distribution_version'] if ansible_facts['distribution'] in ['Ubuntu'] else
        ansible_facts['distribution_major_version'] if ansible_facts['distribution'] in ['Debian'] else
        'default' -}}

# Get distribution configuration
tailscale_distro_config: >-
    {{- tailscale_distributions.get(ansible_facts['distribution'], {}).get(tailscale_version_key) or
        tailscale_distributions.get(ansible_facts['distribution'], {}).get('default') or
        tailscale_fallback -}}

# Cache written by the tailscale.fact script (templates/etc/ansible/facts.d)
_tailscale_facts_cache_file: "{{ facts_cache_dir | default('/var/cache/ansible-facts') }}/tailscale_facts.json"
