---
# Tailscale Local Facts Tasks
# Install the facts script that will be automatically gathered

- name: Create facts.d directory
  ansible.builtin.file:
      path: /etc/ansible/facts.d
      state: directory
      mode: "0755"
      owner: root
      group: root
  become: true
  tags: [tailscale, facts]

- name: Install Tailscale local facts script
  ansible.builtin.template:
      src: etc/ansible/facts.d/tailscale.fact.j2
      dest: /etc/ansible/facts.d/tailscale.fact
      mode: "0755"
      owner: root
      group: root
  become: true
  tags: [tailscale, facts]

# The fact script caches its output for facts_tailscale_cache_duration;
# drop it so the auth decision in configure.yml sees the current state.
- name: Drop cached Tailscale facts
  ansible.builtin.file:
      path: "{{ _tailscale_facts_cache_file }}"
      state: absent
  changed_when: false
  become: true
  tags: [tailscale, facts]

- name: Refresh Tailscale local facts
  ansible.builtin.setup:
      filter: ansible_local
  tags: [tailscale, facts]
