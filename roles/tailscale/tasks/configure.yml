---
# Tailscale Configuration Tasks
# Configure Tailscale with auth key and settings using idempotent module

- name: Ensure Tailscale configuration directory exists
  ansible.builtin.file:
      path: "{{ tailscale_config_dir }}"
      state: directory
      mode: "0755"
      owner: root
      group: root
  become: true
  tags: [tailscale, config, daemon]

- name: Check if any config options are set
  ansible.builtin.set_fact:
      # Scalars are cast to string before measuring length: several of
      # these options accept booleans (e.g. tailscale_accept_routes,
      # tailscale_ssh_enabled), and `bool | length` raises "object of
      # type 'bool' has no len()". Lists keep their native length.
      _tailscale_has_config: >-
          {{
            (tailscale_server_url | default('') | string | length > 0) or
            (tailscale_locked | default('') | string | length > 0) or
            (tailscale_daemon_enabled | default('') | string | length > 0) or
            (tailscale_hostname | default('') | string | length > 0) or
            (tailscale_operator_user | default('') | string | length > 0) or
            (tailscale_accept_dns | default('') | string | length > 0) or
            (tailscale_accept_routes | default('') | string | length > 0) or
            (tailscale_advertise_routes | default([]) | length > 0) or
            (tailscale_advertise_exit_node | default('') | string | length > 0) or
            (tailscale_snat_subnet_routes | default('') | string | length > 0) or
            (tailscale_exit_node | default('') | string | length > 0) or
            (tailscale_exit_node_allow_lan_access | default('') | string | length > 0) or
            (tailscale_ssh_enabled | default('') | string | length > 0) or
            (tailscale_webclient_enabled | default('') | string | length > 0) or
            (tailscale_shields_up | default('') | string | length > 0) or
            (tailscale_posture_checking | default('') | string | length > 0) or
            (tailscale_advertise_services | default([]) | length > 0) or
            (tailscale_advertise_connector | default('') | string | length > 0) or
            (tailscale_auto_update_check | default('') | string | length > 0) or
            (tailscale_auto_update_apply | default('') | string | length > 0) or
            (tailscale_netfilter_mode | default('') | string | length > 0) or
            (tailscale_stateful_filtering | default('') | string | length > 0) or
            (tailscale_static_endpoints | default([]) | length > 0)
          }}
  tags: [tailscale, config, daemon]

- name: Decide whether config.json is written
  ansible.builtin.set_fact:
      # Only systemd hosts get the override that passes --config; elsewhere
      # (Alpine/OpenRC) the file would never be read.
      _tailscale_write_config: >-
          {{ (tailscale_config_enabled | default(true) | bool) and (_tailscale_has_config | bool)
             and ansible_facts['service_mgr'] == 'systemd' }}
  tags: [tailscale, config, daemon]

- name: Configure Tailscale daemon configuration file
  ansible.builtin.template:
      src: etc/tailscale/config.json.j2
      dest: "{{ tailscale_config_file }}"
      mode: "0644"
      owner: root
      group: root
  become: true
  when: _tailscale_write_config | bool
  notify: "tailscale: reload tailscale config"
  tags: [tailscale, config, daemon]

- name: Create Tailscale systemd override directory
  ansible.builtin.file:
      path: /etc/systemd/system/tailscaled.service.d
      state: directory
      mode: "0755"
      owner: root
      group: root
  become: true
  when:
      - ansible_facts['service_mgr'] == 'systemd'
      - _tailscale_write_config | bool or tailscale_service_override | length > 0
  tags: [tailscale, config, systemd]

- name: Configure Tailscale systemd service override
  ansible.builtin.template:
      src: etc/systemd/system/tailscaled.service.d/override.conf.j2
      dest: /etc/systemd/system/tailscaled.service.d/override.conf
      mode: "0644"
      owner: root
      group: root
  become: true
  when:
      - ansible_facts['service_mgr'] == 'systemd'
      - _tailscale_write_config | bool or tailscale_service_override | length > 0
  notify:
      - "tailscale: reload systemd"
      - "tailscale: restart tailscaled"
  tags: [tailscale, config, daemon, systemd]

- name: Fail on a reset without an auth key
  ansible.builtin.assert:
      that: tailscale_auth_key | length > 0
      fail_msg: >-
          tailscale_reset_authentication needs tailscale_auth_key: without it the
          host would be logged out and left waiting for an interactive login.
  when: tailscale_reset_authentication | default(false) | bool
  tags: [tailscale, config, auth, reset]

# Decided once up front: a block `when` is re-evaluated for every task,
# including `always`, so testing ansible_local there would skip the key
# file cleanup once the refresh below reports the host as authenticated.
# tempfile has no check mode, so a check run skips authentication.
- name: Decide whether to authenticate
  ansible.builtin.set_fact:
      _tailscale_authenticate: >-
          {{
            (tailscale_auth_key | length > 0) and (not ansible_check_mode) and
            ((not ansible_local.tailscale.authenticated | default(false)) or
             (tailscale_reset_authentication | default(false) | bool))
          }}
  tags: [tailscale, config, auth, reset]

# The key goes through a 0600 file (`--auth-key=file:`), not the command
# line, where any local user could read it from ps or /proc.
- name: Authenticate Tailscale
  when: _tailscale_authenticate | bool
  tags: [tailscale, config, auth, reset]
  block:
      - name: Create temporary auth key file
        ansible.builtin.tempfile:
            state: file
            suffix: .tailscale-authkey
        become: true
        register: _tailscale_auth_key_file

      - name: Write auth key to temporary file
        ansible.builtin.copy:
            content: "{{ tailscale_auth_key }}"
            dest: "{{ _tailscale_auth_key_file.path }}"
            mode: "0600"
            owner: root
            group: root
        become: true
        no_log: true

      - name: Logout from Tailscale
        ansible.builtin.command:
            cmd: tailscale logout
        become: true
        changed_when: true
        when: tailscale_reset_authentication | default(false) | bool

      - name: Authenticate with auth key
        ansible.builtin.command:
            cmd: >
                tailscale up
                --auth-key=file:{{ _tailscale_auth_key_file.path }}
                {% if tailscale_tags | default([]) | length > 0 %}--advertise-tags={{ tailscale_tags | join(',') }}{% endif %}
                --reset
        become: true
        changed_when: true
        notify: "tailscale: restart tailscaled"
        no_log: "{{ tailscale_no_log_auth_key | default(true) }}"

      # Preferences below need the authenticated state on this run; the
      # fact script caches its output, so drop the pre-auth snapshot first.
      - name: Drop cached Tailscale facts
        ansible.builtin.file:
            path: "{{ _tailscale_facts_cache_file }}"
            state: absent
        changed_when: false
        become: true

      - name: Refresh Tailscale facts after authentication
        ansible.builtin.setup:
            filter: ansible_local
  always:
      - name: Remove temporary auth key file
        ansible.builtin.file:
            path: "{{ _tailscale_auth_key_file.path }}"
            state: absent
        become: true
        when: _tailscale_auth_key_file.path is defined

# One `tailscale set` call; changed only when the prefs actually moved.
- name: Set custom Tailscale preferences
  ansible.builtin.shell:
      cmd: |
          set -e
          before=$(tailscale debug prefs)
          tailscale set {% for key, value in tailscale_preferences.items() %}--{{ key }}={{ value | string | quote }} {% endfor %}

          after=$(tailscale debug prefs)
          [ "$before" = "$after" ] || echo CHANGED
  become: true
  register: _tailscale_custom_prefs
  changed_when: "'CHANGED' in _tailscale_custom_prefs.stdout"
  when:
      - tailscale_preferences | default({}) | length > 0
      - ansible_local.tailscale.authenticated | default(false)
  tags: [tailscale, config, preferences]

# Restart and reload now, so verify.yml sees the configured daemon.
- name: Apply pending Tailscale restarts and reloads
  ansible.builtin.meta: flush_handlers
  tags: [tailscale, config]
