---
# apt matches an "=" pin against the full version string and does not expand
# globs in it, so the string the repository publishes for tailscale_version is
# looked up on the host. Runs after the cache update so madison sees the
# current repository index.

- name: Look up the tailscale versions the apt repository offers
  ansible.builtin.command:
      cmd: "apt-cache madison {{ tailscale_package_name }}"
  register: _tailscale_madison
  changed_when: false
  check_mode: false
  tags: [tailscale, install, package]

- name: Resolve the full apt version string for tailscale_version
  ansible.builtin.set_fact:
      _tailscale_apt_version: >-
          {{ _tailscale_madison.stdout_lines
             | arillso.agent.apt_version_pin(tailscale_version)
             | default('', true) }}
  tags: [tailscale, install, package]

- name: Fail when tailscale_version is not in the repository
  ansible.builtin.fail:
      msg: >-
          tailscale_version {{ tailscale_version }} is not available as a
          {{ tailscale_package_name }} package in the configured apt repository. Set it to a
          version listed by `apt-cache madison {{ tailscale_package_name }}`, or to an empty
          string to install whatever the repository offers.
  # In check mode the repository tasks above did not run on a fresh host, so
  # madison finds nothing; the dry run then installs unpinned instead of failing.
  when:
      - _tailscale_apt_version | length == 0
      - not ansible_check_mode
  tags: [tailscale, install, package]
