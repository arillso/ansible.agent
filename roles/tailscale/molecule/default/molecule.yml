---
dependency:
    name: galaxy
    options:
        requirements-file: requirements.yml

driver:
    name: docker

platforms:
    - name: tailscale-ubuntu2204
      image: geerlingguy/docker-ubuntu2204-ansible:latest@sha256:11e943a042e44674fa57bbc41c666f8e663f4c4ae21ced8a0ae23e09a8112773
      command: ""
      volumes:
          - /sys/fs/cgroup:/sys/fs/cgroup:rw
      cgroupns_mode: host
      privileged: true
      pre_build_image: true

    - name: tailscale-ubuntu2404
      image: geerlingguy/docker-ubuntu2404-ansible:latest@sha256:c082ec70ba335195eb9ccdaa0aa0160e99a3861b070173a24d41e44a19fcf403
      command: ""
      volumes:
          - /sys/fs/cgroup:/sys/fs/cgroup:rw
      cgroupns_mode: host
      privileged: true
      pre_build_image: true

    - name: tailscale-debian12
      image: geerlingguy/docker-debian12-ansible:latest@sha256:fc679fe5eb029c5ceeed3beb9c8a7ee116de371e7f62e3341d5a4dba79853004
      command: ""
      volumes:
          - /sys/fs/cgroup:/sys/fs/cgroup:rw
      cgroupns_mode: host
      privileged: true
      pre_build_image: true

provisioner:
    name: ansible
    config_options:
        defaults:
            interpreter_python: auto_silent
            callbacks_enabled: profile_tasks, timer
            stdout_callback: ansible.builtin.default
            result_format: yaml
    inventory:
        host_vars:
            tailscale-ubuntu2204:
                ansible_user: root
            tailscale-ubuntu2404:
                ansible_user: root
            tailscale-debian12:
                ansible_user: root

verifier:
    name: ansible

scenario:
    name: default
    test_sequence:
        - dependency
        - cleanup
        - destroy
        - syntax
        - create
        - prepare
        - converge
        - idempotence
        - side_effect
        - verify
        - cleanup
        - destroy
