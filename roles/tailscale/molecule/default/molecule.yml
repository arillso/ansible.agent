---
dependency:
    name: galaxy
    options:
        requirements-file: requirements.yml

driver:
    name: docker

platforms:
    - name: tailscale-ubuntu2204
      image: geerlingguy/docker-ubuntu2204-ansible:latest@sha256:0b62a4b88f52218322329c508385fbae01aae5a38c4b38a194580a9190b7097d
      command: ""
      volumes:
          - /sys/fs/cgroup:/sys/fs/cgroup:rw
      cgroupns_mode: host
      privileged: true
      pre_build_image: true

    - name: tailscale-ubuntu2404
      image: geerlingguy/docker-ubuntu2404-ansible:latest@sha256:01adc699145ab47eb196b5aa7b056af80548502f8bc99e230afcffb6700cac3d
      command: ""
      volumes:
          - /sys/fs/cgroup:/sys/fs/cgroup:rw
      cgroupns_mode: host
      privileged: true
      pre_build_image: true

    - name: tailscale-debian12
      image: geerlingguy/docker-debian12-ansible:latest@sha256:74c7e3326b2a35aa4f32c2e943e48a03da8698e2d0c484153bb24110387b285d
      command: ""
      volumes:
          - /sys/fs/cgroup:/sys/fs/cgroup:rw
      cgroupns_mode: host
      privileged: true
      pre_build_image: true

provisioner:
    name: ansible
    config_options:
        defaults:
            interpreter_python: auto_silent
            callbacks_enabled: profile_tasks, timer
            stdout_callback: ansible.builtin.default
            result_format: yaml
    inventory:
        host_vars:
            tailscale-ubuntu2204:
                ansible_user: root
            tailscale-ubuntu2404:
                ansible_user: root
            tailscale-debian12:
                ansible_user: root

verifier:
    name: ansible

scenario:
    name: default
    test_sequence:
        - dependency
        - cleanup
        - destroy
        - syntax
        - create
        - prepare
        - converge
        - idempotence
        - side_effect
        - verify
        - cleanup
        - destroy
