---
dependency:
    name: galaxy
    options:
        requirements-file: requirements.yml

driver:
    name: docker

# One platform only: this scenario asserts that nothing happens, which is
# OS-independent.
platforms:
    - name: tailscale-disabled-debian12
      image: geerlingguy/docker-debian12-ansible:latest@sha256:fc679fe5eb029c5ceeed3beb9c8a7ee116de371e7f62e3341d5a4dba79853004
      command: ""
      volumes:
          - /sys/fs/cgroup:/sys/fs/cgroup:rw
      cgroupns_mode: host
      privileged: true
      pre_build_image: true

provisioner:
    name: ansible
    config_options:
        defaults:
            interpreter_python: auto_silent
            callbacks_enabled: profile_tasks, timer
            stdout_callback: ansible.builtin.default
            result_format: yaml
    inventory:
        host_vars:
            tailscale-disabled-debian12:
                ansible_user: root

verifier:
    name: ansible

scenario:
    name: disabled
    test_sequence:
        - dependency
        - cleanup
        - destroy
        - syntax
        - create
        - prepare
        - converge
        - idempotence
        - side_effect
        - verify
        - cleanup
        - destroy
