---
# Tailscale Service Handlers
# Handlers for Tailscale service restarts and systemd reload

- name: Reload systemd to pick up Tailscale unit changes
  ansible.builtin.systemd_service:
      daemon_reload: true
  become: true
  when: ansible_facts['service_mgr'] == 'systemd'
  listen: "tailscale: reload systemd"

- name: Restart tailscaled to apply service changes
  ansible.builtin.service:
      name: tailscaled
      state: restarted
  become: true
  # The install task notifies this too; after a removal there is no unit
  # left, and a stopped service has to stay stopped.
  when:
      - tailscale_package_state != 'absent'
      - tailscale_service_state != 'stopped'
  listen: "tailscale: restart tailscaled"

# A custom tailscale_service_override may start tailscaled without --config;
# reload-config would then fail, so check the unit systemd actually runs.
- name: Reload Tailscale configuration without restarting the daemon
  ansible.builtin.shell:
      cmd: |
          set -e
          unit=$(systemctl cat tailscaled)
          case "$unit" in
              *--config*) tailscale debug reload-config ;;
              *) echo SKIPPED ;;
          esac
  become: true
  # A stopped daemon has no socket; it reads config.json on its next start.
  when: tailscale_service_state != 'stopped'
  listen: "tailscale: reload tailscale config"
  changed_when: "'SKIPPED' not in _tailscale_reload_config.stdout"
  # Runs in the same flush as the restart handler, before the new socket
  # may be up.
  register: _tailscale_reload_config
  retries: 5
  delay: 2
  until: _tailscale_reload_config.rc == 0
